<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Webinar - Rezultate</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --pink: #ff4fa3;
      --pink-dark: #e83e8c;
      --pink-light: #ffe1f0;
      --background: #fff4f9;
      --card: #ffffff;
      --text: #2b1b25;
      --muted: #765f6b;
      --border: #f2bfd7;
      --danger: #dc3545;
      --success: #198754;
      --shadow: 0 15px 40px rgba(220, 62, 140, 0.15);
    }

    body.dark {
      --background: #1d1720;
      --card: #29212c;
      --text: #fff5fa;
      --muted: #d0bdc8;
      --border: #5e4051;
      --pink-light: #51273f;
      --shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at top right,
          rgba(255, 79, 163, 0.18),
          transparent 30%
        ),
        var(--background);

      color: var(--text);
    }

    button {
      font: inherit;
    }

    .container {
      width: min(100% - 32px, 960px);
      margin: 0 auto;
    }

    header {
      padding: 24px 0;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--pink);
      color: white;
    }

    .theme-toggle {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    main {
      padding: 30px 0 70px;
    }

    .hero {
      text-align: center;
      margin-bottom: 32px;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--pink-light);
      color: var(--pink-dark);
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.2rem);
    }

    .hero p {
      margin: 0 auto;
      max-width: 600px;
      color: var(--muted);
    }

    .stats {
      display: flex;
      justify-content: center;
      margin-bottom: 32px;
    }

    .stat-card {
      width: 220px;
      padding: 25px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .stat-number {
      display: block;
      font-size: 3rem;
      line-height: 1;
      font-weight: 900;
      color: var(--pink);
    }

    .stat-label {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: clamp(20px, 4vw, 32px);
      box-shadow: var(--shadow);
    }

    .participants-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .participants-header h2 {
      margin: 0;
      font-size: 1.3rem;
    }

    .refresh-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .participant-list {
      display: grid;
      gap: 10px;
    }

    .participant {
      padding: 16px;
      background: var(--pink-light);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .participant-name {
      font-weight: 800;
      font-size: 1rem;
    }

    .participant-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.85rem;
      word-break: break-word;
    }

    .participant-date {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    .error {
      padding: 16px;
      background: rgba(220, 53, 69, 0.12);
      color: var(--danger);
      border-radius: 12px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 650px) {
      .container {
        width: min(100% - 20px, 960px);
      }

      .card {
        border-radius: 18px;
        padding: 20px 16px;
      }

      .participants-header {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container header-inner">

    <div class="brand">
      <div class="brand-icon" aria-hidden="true">♡</div>
      <span>Webinar Registration</span>
    </div>

    <button
      type="button"
      class="theme-toggle"
      id="themeToggle"
    >
      🌙 Dark mode
    </button>

  </div>
</header>


<main>

  <div class="container">

    <section class="hero">

      <span class="badge">
        RESULTS
      </span>

      <h1>
        Webinar registrations
      </h1>

      <p>
        Lista participanților înscriși la webinar.
      </p>

    </section>


    <section class="stats">

      <div class="stat-card">

        <span
          id="participantCount"
          class="stat-number"
          aria-live="polite"
        >
          —
        </span>

        <span class="stat-label">
          participanți înscriși
        </span>

      </div>

    </section>


    <section class="card">

      <div class="participants-header">

        <h2>
          Participanți
        </h2>

        <button
          type="button"
          class="refresh-btn"
          id="refreshBtn"
        >
          ↻ Refresh
        </button>

      </div>


      <div
        id="participantList"
        class="participant-list"
      ></div>

    </section>

  </div>

</main>


<footer>
  Datele sunt preluate din baza de date.
</footer>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://csnklahuuumauwyyktej.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_eefNHLesThmfx8wN_skqHg_tcmFpf0W";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // ELEMENTS
  // ==========================================

  const participantCount =
    document.getElementById(
      "participantCount"
    );

  const participantList =
    document.getElementById(
      "participantList"
    );

  const refreshBtn =
    document.getElementById(
      "refreshBtn"
    );


  // ==========================================
  // ESCAPE HTML
  // ==========================================

  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value ?? "";

    return div.innerHTML;
  }


  // ==========================================
  // LOAD PARTICIPANTS
  // ==========================================

  async function loadParticipants() {

    participantList.innerHTML =
      "<div class='empty'>Se încarcă...</div>";

    participantCount.textContent =
      "—";


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("participants")
          .select(
            "id, name, email, company, city, birth_date, age, registered_at"
          )
          .order(
            "registered_at",
            {
              ascending: false
            }
          );


      if (error) {
        throw error;
      }


      const participants =
        data || [];


      participantCount.textContent =
        participants.length;


      participantList.innerHTML =
        "";


      if (
        participants.length === 0
      ) {

        participantList.innerHTML = `
          <div class="empty">
            Nu există încă participanți înscriși.
          </div>
        `;

        return;
      }


      participants.forEach(
        participant => {

          const element =
            document.createElement(
              "article"
            );

          element.className =
            "participant";


          const registeredAt =
            participant.registered_at
              ? new Date(
                  participant.registered_at
                ).toLocaleString(
                  "ro-RO"
                )
              : "";


          const birthDate =
            participant.birth_date
              ? new Date(
                  participant.birth_date +
                  "T00:00:00"
                ).toLocaleDateString(
                  "ro-RO"
                )
              : "";


          element.innerHTML = `

            <div class="participant-name">
              ${escapeHTML(
                participant.name
              )}
            </div>

            <div class="participant-meta">
              ${escapeHTML(
                participant.email
              )}
              ·
              ${escapeHTML(
                participant.company
              )}
              ·
              ${escapeHTML(
                participant.city
              )}
              ·
              ${participant.age} ani
            </div>

            <div class="participant-meta">
              Data nașterii:
              ${escapeHTML(
                birthDate
              )}
            </div>

            <div class="participant-date">
              Înscris la:
              ${escapeHTML(
                registeredAt
              )}
            </div>

          `;


          participantList.appendChild(
            element
          );

        }
      );


    } catch (error) {

      console.error(
        "Could not load participants:",
        error
      );


      participantCount.textContent =
        "—";


      participantList.innerHTML = `

        <div class="error">
          Ne pare rău, întâmpinăm probleme tehnice
          și nu putem încărca lista participanților.
          Te rugăm să încerci din nou mai târziu.
        </div>

      `;

    }

  }


  refreshBtn.addEventListener(
    "click",
    loadParticipants
  );


  // ==========================================
  // DARK MODE
  // ==========================================

  const THEME_KEY =
    "webinarTheme";

  const themeToggle =
    document.getElementById(
      "themeToggle"
    );


  function applyTheme(theme) {

    document.body.classList.toggle(
      "dark",
      theme === "dark"
    );

    themeToggle.textContent =
      theme === "dark"
        ? "☀️ Light mode"
        : "🌙 Dark mode";
  }


  const savedTheme =
    localStorage.getItem(
      THEME_KEY
    );


  if (savedTheme) {

    applyTheme(savedTheme);

  } else if (
    window.matchMedia(
      "(prefers-color-scheme: dark)"
    ).matches
  ) {

    applyTheme("dark");

  }


  themeToggle.addEventListener(
    "click",
    () => {

      const newTheme =
        document.body.classList.contains("dark")
          ? "light"
          : "dark";

      applyTheme(newTheme);

      localStorage.setItem(
        THEME_KEY,
        newTheme
      );

    }
  );


  // ==========================================
  // INITIAL LOAD
  // ==========================================

  loadParticipants();

</script>

</body>
</html>
